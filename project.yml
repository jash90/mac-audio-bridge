name: MacAudioBridge
options:
  bundleIdPrefix: dev.jash90
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  BridgeCore:
    path: Packages/BridgeCore
settings:
  base:
    DEVELOPMENT_TEAM: H2X8YGN869
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Sender:
    type: application
    platform: macOS
    sources:
      - path: Apps/Sender-macOS
        excludes:
          - "Info.plist"
          - "Sender.entitlements"
      # Run by /usr/bin/perl to read Now Playing (see NowPlayingMonitor).
      - path: ThirdParty/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: BridgeCore
      # Loaded by the adapter script inside perl, never linked into the app.
      - target: MediaRemoteAdapter
        link: false
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jash90.MacAudioBridge.Sender
        PRODUCT_NAME: Mac Audio Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Apps/Sender-macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/Sender-macOS/Sender.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # Vendored ungive/mediaremote-adapter v0.7.7 (BSD-3-Clause), built as in
  # its CMakeLists.txt: ARC, default symbol visibility (the perl script finds
  # its functions by name), Foundation + AppKit + UniformTypeIdentifiers.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: ThirdParty/mediaremote-adapter/src
        excludes:
          - "test/*.m"
      - path: ThirdParty/mediaremote-adapter/include
        headerVisibility: public
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jash90.MacAudioBridge.MediaRemoteAdapter
        PRODUCT_NAME: MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/ThirdParty/mediaremote-adapter/src", "$(PROJECT_DIR)/ThirdParty/mediaremote-adapter/include"]
        ARCHS: [arm64, x86_64]
        ONLY_ACTIVE_ARCH: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Known benign warnings in the unmodified upstream sources (K&R-style
        # `()` prototypes, one unused local in get.m).
        CLANG_WARN_STRICT_PROTOTYPES: NO
        WARNING_CFLAGS: ["$(inherited)", "-Wno-strict-prototypes", "-Wno-unused-variable"]
  Receiver:
    type: application
    platform: iOS
    sources:
      - path: Apps/Receiver-iOS
        excludes:
          - "Info.plist"
    dependencies:
      - package: BridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jash90.MacAudioBridge.Receiver
        PRODUCT_NAME: Mac Audio Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Apps/Receiver-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  Driver:
    type: bundle
    platform: macOS
    sources:
      - path: Driver
        excludes:
          - "Info.plist"
      - path: ThirdParty/libASPL/src
    dependencies:
      - sdk: CoreFoundation.framework
      - sdk: CoreAudio.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jash90.MacAudioBridge.Driver
        PRODUCT_NAME: MacAudioBridge
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: Driver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: mh_bundle
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_ENABLE_MODULES: NO
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/ThirdParty/libASPL/include"]
        # Universal driver: works on Apple silicon and Intel Macs.
        ARCHS: [arm64, x86_64]
        ONLY_ACTIVE_ARCH: NO
        # The factory symbol is referenced only through Info.plist keys, never
        # from code — never let the linker strip it.
        DEAD_CODE_STRIPPING: NO
        # -Wall for our code; the two -Wno flags silence known benign warnings
        # inside vendored libASPL (Stream.hpp designator order, offsetof in
        # Driver.cpp) so third-party sources stay byte-identical to upstream.
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-Wall", "-Wno-reorder-init-list", "-Wno-invalid-offsetof"]
schemes:
  Sender:
    build:
      targets:
        Sender: all
    run:
      config: Debug
  Receiver:
    build:
      targets:
        Receiver: all
    run:
      config: Debug
  Driver:
    build:
      targets:
        Driver: all
    run:
      config: Debug
